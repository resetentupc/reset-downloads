name: Build Chocolatey Package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Chocolatey Natively
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          echo "$env:ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Download Release ZIP Natively
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "${{ github.event.release.tag_name }}"
          
          Write-Host "Buscando assets para el release $tag en el repositorio $repo..."
          
          # Consultar la API de GitHub para obtener la lista de assets del release
          $headers = @{ "Authorization" = "token $env:GITHUB_TOKEN" }
          $apiUrl = "https://api.github.com/repos/$repo/releases/tags/$tag"
          $releaseInfo = Invoke-RestMethod -Uri $apiUrl -Headers $headers -Method Get
          
          # Encontrar el archivo .zip adjunto
          $zipAsset = $releaseInfo.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
          
          if (-not $zipAsset) {
              throw "No se encontró ningún archivo .zip adjunto en este release."
          }
          
          $downloadUrl = $zipAsset.browser_download_url
          $fileName = $zipAsset.name
          
          Write-Host "Descargando: $fileName desde $downloadUrl..."
          Invoke-WebRequest -Uri $downloadUrl -OutFile $fileName -Headers $headers
          Write-Host "¡Descarga completada con éxito!"

      - name: Build NUPKG Package Dynamically
        shell: pwsh
        run: |
          $zipAsset = Get-ChildItem -Filter *.zip | Select-Object -First 1
          if (-not $zipAsset) {
              throw "No se encontró ningún archivo .zip en el directorio."
          }

          $baseName = $zipAsset.BaseName
          $parts = $baseName -split '-'   
          $marca = $parts[1]          
          $modelo = $parts[2]         

          $nuspecContent = Get-Content -Path "template.nuspec" -Raw
          $nuspecContent = $nuspecContent -replace '\$MARCA\$', $marca
          $nuspecContent = $nuspecContent -replace '\$MODELO\$', $modelo
          
          $finalNuspecName = "reset-$marca-$modelo.nuspec"
          Set-Content -Path $finalNuspecName -Value $nuspecContent

          choco pack $finalNuspecName

      - name: Upload NUPKG to Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: '*.nupkg'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
